<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bench sheet</title>
    <style>
      body {
        margin: 0;
        background: #14120f;
        color: #d7cbb8;
        font: 13px/1.5 ui-monospace, monospace;
      }
      h1 {
        margin: 14px 16px 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #e0a866;
      }
      canvas {
        display: block;
        margin: 10px auto 0;
      }
      #marks {
        display: grid;
        margin: 0 auto;
        border-top: 1px solid #342c22;
        padding-top: 8px;
      }
      #marks div {
        padding: 0 6px;
        text-align: center;
        white-space: pre-line;
      }
      #marks b {
        display: block;
        color: #e0a866;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>one strike, over the anvil, from the room's own camera</h1>
    <canvas id="sheet"></canvas>
    <div id="marks"></div>
    <script type="module" src="./bench.ts"></script>
  </body>
</html>
