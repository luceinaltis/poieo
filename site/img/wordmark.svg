<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1070 420" role="img" aria-label="poieo">
  <!-- The wordmark: p-o-i-e-o in monoline circles and stems, no typeface. One
       special moment only — the e's top flows straight into the final o along
       a bridge tangent to both, so the word's last two letters are bound the
       way a role is bound to a model. The i's dot is the one amber accent. -->
  <g stroke="#e8e2d8" stroke-width="52" stroke-linecap="round" fill="none">
    <line x1="0" y1="100" x2="0" y2="380"/>
    <circle cx="100" cy="200" r="74"/>
    <circle cx="340" cy="200" r="74"/>
    <line x1="506" y1="100" x2="506" y2="300"/>
    <path d="M 746 200 A 74 74 0 1 0 724.6 252.3"/>
    <line x1="598" y1="200" x2="746" y2="200"/>
    <line x1="672" y1="126" x2="912" y2="126"/>
    <circle cx="912" cy="200" r="74"/>
  </g>
  <circle cx="506" cy="38" r="30" fill="#d8a657"/>
</svg>
