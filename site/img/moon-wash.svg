<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="3" seed="8" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation=".65"/>
    </filter>
    <radialGradient id="pigment" cx="50%" cy="50%" r="50%">
      <stop stop-color="#e5dfcc" stop-opacity=".82"/>
      <stop offset=".72" stop-color="#e5dfcc" stop-opacity=".82"/>
      <stop offset="1" stop-color="#cacabb" stop-opacity=".55"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="66" fill="#cacabb" opacity=".1" filter="url(#wash)"/>
  <circle cx="100" cy="100" r="63" fill="url(#pigment)" filter="url(#wash)"/>
  <path d="M47 121 Q35 89 56 63" fill="none" stroke="#e5dfcc" stroke-width="2.5" opacity=".1" filter="url(#wash)"/>
</svg>
