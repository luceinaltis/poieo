<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>poieo share card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="share-page">
  <img class="brand-word" src="img/signature.svg" alt="poieo" width="190" height="68">
  <h1>The right intelligence, in the right place.</h1>
  <p>Small and large models,<br>working together.</p>
  <p class="share-foot">Your work keeps going. You stay in control.</p>
  <svg class="share-diagram" viewBox="0 0 390 520" role="img" aria-label="Small model steps connect to a larger model, then to checks">
    <g class="flow-lines" fill="none" stroke-width="2"><path d="M38 128 V228 M38 252 V352"/><path d="M50 364 H100 Q124 364 124 340 V262 Q124 240 148 240 H190"/><path d="M270 320 V424 H175"/></g>
    <g class="small-step"><circle cx="38" cy="116" r="12"/><circle cx="38" cy="240" r="12"/><circle cx="38" cy="364" r="12"/></g>
    <circle class="large-halo" cx="270" cy="240" r="100" fill="none"/>
    <circle class="large-step" cx="270" cy="240" r="80"/>
    <rect class="check-step" x="135" y="403" width="42" height="42" rx="8"/>
    <path class="check-tick" d="M145 424 l7 7 14-17" fill="none" stroke-width="2"/>
  </svg>
</body>
</html>
