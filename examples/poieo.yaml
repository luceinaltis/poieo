# The project: where runs land, which models answer, and where the jobs live.
# Paths are resolved relative to this file.
#
# There is no list of jobs here. A job is one file in `tasks/` -- drop one in
# and it runs; delete it and it stops. One file per job is what lets a board
# create one, and what keeps a diff about a job to that job.
version: 1
store: runs
binding: models/mock.yaml         # swap for models/claude.yaml or models/local.yaml
tasks: tasks/                     # the cards, and the graphs they name
