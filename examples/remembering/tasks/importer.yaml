# Half of a project that remembers. The project's memory/ folder is
# read before every run: the page whole, then entries chosen for this card --
# here batch-cap (scoped to it) and rate-limits (global), never old-batch-cap
# (set aside). `poieo memory examples/remembering/tasks/importer.yaml` shows the
# exact block.
name: import the feeds
folder: ../notebook
every: 1h
prompt: |
  Pull the feeds listed in feeds.md into the notebook, in batches.
