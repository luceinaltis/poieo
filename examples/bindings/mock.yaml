# Physical layer for local development: no network, no tokens spent.
# A list value is a script -- one entry per call to that role.
name: mock
version: 1

providers:
  fake:
    type: mock
    options:
      responses:
        classifier: bug
        writer:
          - "A first draft that is merely adequate."
          - "A revised draft, now with a verb that earns its keep."
        critic:
          - '{"approved": false, "feedback": "The middle clause is limp."}'
          - '{"approved": true, "feedback": "Good."}'
        worker:
          - tool_calls:
              - {name: list_dir, arguments: {}}
          - tool_calls:
              - name: write_file
                arguments: {path: TODO.md, content: "- write more tests\n- add docs\n- ship\n"}
          - "Wrote TODO.md with three next steps."
        "*": "(mock response)"

default:
  provider: fake
  model: mock-model
