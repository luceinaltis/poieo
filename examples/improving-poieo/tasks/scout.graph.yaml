# Find one thing worth building next.
#
# Two nodes, and the split is the point. Told to "read the roadmap and the
# component docs" and propose something, a capable model read twenty-one files
# across twelve turns and never reached a conclusion -- the step was
# open-ended, not the model slow. Naming the files is what makes it finish.
#
# Then deciding happens in a node with no hands, which cannot wander off to
# read one more file instead of answering.
name: scout
version: 1
entry: survey

nodes:
  - id: survey
    type: agent
    role: reader
    tools: [files]
    max_turns: 10
    # Far more room than the role's default, and measured rather than guessed:
    # reading four files and writing five lines about them cost 7,677 output
    # tokens on the model this was tried against, nearly all of it reasoning.
    # At 3,000 the node produced no text at all and failed `out_of_room`.
    #
    # A ceiling is not a reservation -- you are billed for what is generated,
    # not for what you allowed -- so the generous number is the cheap one. Set
    # it tight and you pay for a run that fails instead of one that finishes.
    params:
      max_tokens: 8000
    prompt: |
      Read exactly these, and nothing else:

        DESIGN.md         its Roadmap says what has shipped and what has not,
                          and its Non-goals say what is not wanted
        docs/README.md    the index of one document per component

      Then read at most TWO component documents from docs/ -- whichever the
      roadmap suggests is least finished.

      Report what you found as a short list of gaps: places where DESIGN.md or
      a component document promises something the code is not described as
      doing. Five lines at most. Do not propose anything yet, and do not read
      anything else.

    output:
      as: survey
    next: pick

  - id: pick
    type: agent
    role: reader
    prompt: |
      These are the gaps someone found in this project:

      {{ survey }}

      {% if input.get('sender', {}).get('outputs', {}).get('carry') %}
      This came back as too big to build in one commit:

      {{ input.get('sender', {}).get('outputs', {}).get('carry') }}

      Do not propose it again. Either propose the smallest piece of it that
      stands on its own, or choose a different gap.
      {% endif %}

      Choose exactly one to build. It must be small enough that one person
      would land it as a single commit: one behaviour, one test.

      Reply in exactly this shape and nothing else:

        WHAT   one line, what to build
        WHY    one line, what makes it the next thing
        WHERE  the files you expect to touch
        TEST   the test that should fail before it and pass after
    output:
      as: proposal
