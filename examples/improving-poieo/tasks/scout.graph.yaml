# Find one thing worth building next.
#
# Reading only. The proposal leaves as a node output rather than a file,
# because the flow that builds it works in its own private copy and would not
# see a file this one wrote.
name: scout
version: 1
entry: look

nodes:
  - id: look
    type: agent
    role: reader
    tools: [files]
    max_turns: 12
    prompt: |
      You are looking for the next small thing to build in this project.

      Read DESIGN.md first -- its Roadmap says what has shipped and what has
      not, and its Non-goals say what this project has decided against.

      Then read docs/README.md, which indexes one document per component, and
      the component document nearest whatever DESIGN.md says is unfinished.
      Those describe how the code is shaped today; where one promises
      something the code does not do, that gap is a candidate.

      Do not go looking in docs/archive/. It is history -- accurate about the
      intent on the day it was written, and not guaranteed to describe the
      code now. Nothing new is written there.

      Propose exactly one thing to build. It must be small enough that one
      person would land it as a single commit: one behaviour, one test.

      Reply with:
        WHAT   one line, what to build
        WHY    one line, what makes it the next thing
        WHERE  the files you expect to touch
        TEST   the test that should fail before it and pass after

      Nothing else. Do not start building it.
    output:
      as: proposal
