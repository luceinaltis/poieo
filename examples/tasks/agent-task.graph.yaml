name: agent-task
description: One resident step that actually touches files.
entry: work

nodes:
  - id: work
    type: agent
    role: worker
    # No workdir here on purpose: a path is physical, and this file is not.
    # `poieo run --workdir`, or a flow's `workdir:`, says where it happens.
    prompt: |
      Look at the project in your working directory and write a TODO.md
      listing the three most useful next steps.
    max_turns: 10
    output: {as: report}
