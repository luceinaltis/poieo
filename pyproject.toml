[build-system]
# 77, not 68. `license = "MIT"` below is PEP 639's spelling, and a setuptools
# older than 77 does not understand it -- the floor is what makes the licence
# readable rather than a build error. 77 also wants `packaging>=24.2` beside
# it, which pip's build isolation supplies; a build run with
# `--no-build-isolation` against an older `packaging` is the one that fails.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poieo"
version = "0.1.0"
description = "A harness that separates logical workflows from the physical models that execute them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "starlette>=0.37",
    "typer>=0.12",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.15,<0.16", "pytest-cov>=5.0"]
# Running a step on a Claude plan instead of an API key. An extra rather than a
# dependency: it brings a whole coding agent with it, it needs the Claude Code
# CLI on the machine beside it, and most bindings here never name one. The
# provider imports it late and says this line by name when it is missing.
claude-code = ["claude-agent-sdk>=0.2"]

[project.scripts]
poieo = "poieo.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# The board. `src/poieo/web/static/` is not a package -- it has no __init__ and
# never will, being a vite build -- so `packages.find` walks straight past it
# and the wheel ships a daemon that serves nothing.
#
# It went unnoticed because every install in this repository is `pip install -e
# .`, which points at the source tree where the files are. An editable install
# is exactly the one that cannot see this.
#
# `**`, not `static/*` plus `static/assets/*`: the pattern must not encode the
# shape of a build it does not control. A vite config that emits one folder
# deeper would drop those files back out, silently, in the same way.
[tool.setuptools.package-data]
"poieo.web" = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# 120, not the default 88. The comments here carry as much as the code and are
# wrapped by hand at about 86; the formatter never reflows those, so the limit
# only governs code -- where 88 was splitting readable conditions across five
# lines. At 120 the same file has 11 long lines instead of 374.
line-length = 120

[tool.ruff.lint]
# Deliberately narrow. `F` is "this is wrong" -- a name that does not exist, an
# import nobody uses, an f-string with nothing to fill in -- and reports almost
# no false positives, which is what keeps the warning worth reading. `E501` and
# `I` are mechanical. Style opinions past that are not enforced on purpose.
select = ["F", "E501", "I"]

[tool.ruff.lint.per-file-ignores]
# These two hold JavaScript and CSS inside Python strings. A `# noqa` would be
# written into the asset rather than the module, so the line cannot be excused
# where it sits -- and rewrapping somebody else's language by hand to satisfy a
# Python limit is how a template quietly stops parsing.
"src/poieo/editor.py" = ["E501"]
"src/poieo/viewer.py" = ["E501"]
