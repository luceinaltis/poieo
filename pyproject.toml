[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poieo"
version = "0.1.0"
description = "A harness that separates logical workflows from the physical models that execute them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "starlette>=0.37",
    "typer>=0.12",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.15"]

[project.scripts]
poieo = "poieo.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# 120, not the default 88. The comments here carry as much as the code and are
# wrapped by hand at about 86; the formatter never reflows those, so the limit
# only governs code -- where 88 was splitting readable conditions across five
# lines. At 120 the same file has 11 long lines instead of 374.
line-length = 120

[tool.ruff.lint]
# Deliberately narrow. `F` is "this is wrong" -- a name that does not exist, an
# import nobody uses, an f-string with nothing to fill in -- and reports almost
# no false positives, which is what keeps the warning worth reading. `E501` and
# `I` are mechanical. Style opinions past that are not enforced on purpose.
select = ["F", "E501", "I"]

[tool.ruff.lint.per-file-ignores]
# These two hold JavaScript and CSS inside Python strings. A `# noqa` would be
# written into the asset rather than the module, so the line cannot be excused
# where it sits -- and rewrapping somebody else's language by hand to satisfy a
# Python limit is how a template quietly stops parsing.
"src/poieo/editor.py" = ["E501"]
"src/poieo/viewer.py" = ["E501"]
